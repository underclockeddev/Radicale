name: Radicale
services:
    radicale:
        build:
          context: .
          dockerfile: Dockerfile.dev
          args:
            DEPENDENCIES: bcrypt
        ports:
        - 5232:5232
        volumes:
          - config:/etc/radicale
          - data:/var/lib/radicale

volumes:
  config:
    name: radicale-config
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./config.d
  data:
    name: radicale-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
