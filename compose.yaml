name: Radicale
services:
    radicale:
        build:
          context: .
          dockerfile: Dockerfile.dev
          args:
            DEPENDENCIES: bcrypt
        user: "1000:1000"
        ports:
        - 5232:5232
        volumes:
          - config:/etc/radicale
          - data:/var/lib/radicale
          - ${VAULT_CALENDAR_PATH:-./.vault-calendar}:/vault/Calendar

volumes:
  config:
    name: radicale-config
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./config.d
  data:
    name: radicale-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data
